<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      try {
        // Mantener sincronizado con STORAGE_VERSION en src/lib/storage.ts.
        const version = 1;
        const clave = "odonto-plan:paleta";
        const paleta =
          localStorage.getItem(`${clave}:v${version}`) ??
          (version === 1 ? localStorage.getItem(clave) : null);
        // Mantener sincronizado con PALETAS_LEGACY en src/lib/palette/index.ts.
        const anteriores = {
          oceano: "blue-amber",
          bosque: "emerald-lime",
          atardecer: "orange-violet",
        };
        if (paleta) {
          document.documentElement.dataset.palette = Object.hasOwn(anteriores, paleta)
            ? anteriores[paleta]
            : paleta;
        }
      } catch {}
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
